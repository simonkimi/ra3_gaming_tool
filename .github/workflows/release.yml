name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  USERNAME: ${{ github.repository_owner }}
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite"

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Add GitHub Packages NuGet source
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $vcpkg = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
          $nuget = (& $vcpkg fetch nuget | Select-Object -Last 1).Trim()
          if (-not (Test-Path $nuget)) {
            throw "nuget.exe not found: $nuget"
          }
          & $nuget sources add `
            -Name GitHubPackages `
            -Source $env:FEED_URL `
            -Username $env:USERNAME `
            -Password $env:GITHUB_TOKEN `
            -StorePasswordInClearText
          & $nuget setapikey $env:GITHUB_TOKEN -Source $env:FEED_URL

      - name: Configure
        run: cmake --preset windows-msvc-x86-release

      - name: Build
        run: cmake --build --preset release --parallel --target game_overlay --target game_injector

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/game_overlay.dll
            build/release/game_injector.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
